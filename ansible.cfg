[defaults]
inventory = lab/inventory.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = /usr/bin/python3
forks = 5

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=.lab/known_hosts
pipelining = True

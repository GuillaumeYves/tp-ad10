- name: Restart Prometheus
  ansible.builtin.service:
    name: prometheus
    state: restarted

- name: Restart Alertmanager
  ansible.builtin.service:
    name: prometheus-alertmanager
    state: restarted

- name: Restart Grafana
  ansible.builtin.service:
    name: grafana-server
    state: restarted

- name: Restart alert receiver
  ansible.builtin.systemd_service:
    name: ad10-alert-receiver
    daemon_reload: true
    state: restarted

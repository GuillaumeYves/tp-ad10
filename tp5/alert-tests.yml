rule_files:
  - /etc/prometheus/ad10-alerts.yml
evaluation_interval: 15s
tests:
  - interval: 15s
    input_series:
      - series: 'node_memory_MemTotal_bytes{host="web1",instance="test:9100",job="nodes"}'
        values: '100+0x20'
      - series: 'node_memory_MemAvailable_bytes{host="web1",instance="test:9100",job="nodes"}'
        values: '20+0x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: MemoryUsageHigh
        exp_alerts: []
  - interval: 15s
    input_series:
      - series: 'node_memory_MemTotal_bytes{host="web1",instance="test:9100",job="nodes"}'
        values: '100+0x20'
      - series: 'node_memory_MemAvailable_bytes{host="web1",instance="test:9100",job="nodes"}'
        values: '15+0x20'
    alert_rule_test:
      - eval_time: 1m
        alertname: MemoryUsageHigh
        exp_alerts: []
      - eval_time: 2m
        alertname: MemoryUsageHigh
        exp_alerts:
          - exp_labels: {host: web1, instance: 'test:9100', job: nodes, severity: warning}
            exp_annotations:
              summary: RAM supérieure à 80 % sur web1
              description: La mémoire disponible représente moins de 20 % du total depuis deux minutes.
  - interval: 15s
    input_series:
      - series: 'node_memory_MemTotal_bytes{host="web1",instance="test:9100",job="nodes"}'
        values: '100+0x20'
      - series: 'node_memory_MemAvailable_bytes{host="web1",instance="test:9100",job="nodes"}'
        values: '15+0x9 30+0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: MemoryUsageHigh
        exp_alerts: []

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/ad10-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: nodes
    static_configs:
      - targets: ['192.168.77.21:9100']
        labels:
          host: 'web1'
      - targets: ['192.168.77.22:9100']
        labels:
          host: 'web2'

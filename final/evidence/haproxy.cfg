global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    log global
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend web_front
    mode http
    bind *:80
    http-request redirect prefix https://localhost:8443 code 301

frontend web_secure
    mode http
    bind *:443 ssl crt /etc/haproxy/certs/edge.pem ssl-min-ver TLSv1.2
    default_backend web_pool

backend web_pool
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server web1 192.168.77.21:80 check inter 1s fall 2 rise 2
    server web2 192.168.77.22:80 check inter 1s fall 2 rise 2

frontend database_write
    mode tcp
    bind 192.168.77.20:3306
    default_backend database_primary

backend database_primary
    mode tcp
    option tcp-check
    server db1 192.168.77.31:3306 check inter 1s fall 2 rise 2

frontend database_read
    mode tcp
    bind 192.168.77.20:3307
    default_backend database_readers

backend database_readers
    mode tcp
    option tcp-check
    server db1 192.168.77.31:3306 check inter 1s fall 2 rise 2
    server db2 192.168.77.32:3306 check backup inter 1s fall 2 rise 2
